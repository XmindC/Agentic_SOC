# gitleaks configuration: the default rules plus lab-specific checks.
[extend]
useDefault = true

[[rules]]
id = "openai-api-key"
description = "OpenAI API key"
regex = '''sk-(proj-)?[A-Za-z0-9_-]{20,}'''
tags = ["key", "openai"]

[[rules]]
id = "personal-email"
description = "Personal email address (use <ALERT_EMAIL>)"
regex = '''[A-Za-z0-9._%+-]+@(gmail|yahoo|outlook|hotmail|icloud|proton)\.[a-z.]+'''
tags = ["pii"]

[[rules]]
id = "home-lan-ip"
description = "Home network address outside the lab ranges"
regex = '''\b192\.168\.1\.\d{1,3}\b'''
tags = ["pii"]

[[rules]]
id = "lab-internal-ip"
description = "Real lab address (use the <..._IP> / <LAB_..._CIDR> placeholders)"
regex = '''\b(10\.10\.10|192\.168\.152)\.\d{1,3}\b'''
tags = ["internal"]

[allowlist]
description = "Placeholders are not secrets"
regexes = ['''<[A-Z0-9_]+>''', '''GENERATE''']
